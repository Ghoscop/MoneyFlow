
services:
  postgres:
    image: postgres:17-alpine
    container_name: moneyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneyflow
      POSTGRES_USER: moneyflow_user
      POSTGRES_PASSWORD: moneyflow_dev_password
    ports:
      - "5432:5432"
    volumes:
      - moneyflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow_user -d moneyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneyflow_data:
