spring.application.name=moneyflow-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/moneyflow
spring.datasource.username=moneyflow_user
spring.datasource.password=moneyflow_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true